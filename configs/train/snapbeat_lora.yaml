defaults:
  - lora
  - _self_

pretrained_path: "OliBomby/Mapperatorinator-v31"

# Avoid W&B unless configured; use tensorboard (see docs/SNAPBEAT_FINETUNING.md).
logging:
  log_with: tensorboard

data:
  dataset_type: "snapbeat"
  # JSON: ./datasets/dataset/json. Audio: ./datasets/dataset/audio (same UUID stems). Override with data.snapbeat_audio_path if audio lives elsewhere (e.g. ./dataset/audio).
  train_dataset_path: "./datasets/dataset"
  test_dataset_path: "./datasets/dataset"
  snapbeat_audio_path: ""
  train_dataset_start: 0
  train_dataset_end: 410
  test_dataset_start: 410
  test_dataset_end: 456
  gamemodes: [3]
  per_track: true
  # Disable osu!-specific features not relevant to SnapBeat
  add_gamemode_token: true
  add_style_token: false
  add_diff_token: false
  add_mapper_token: false
  add_year_token: false
  add_hitsounded_token: false
  add_song_length_token: false
  add_global_sv_token: false
  add_cs_token: false
  add_keycount_token: true
  add_hold_note_ratio_token: true
  add_scroll_speed_ratio_token: false
  add_descriptors: false
  add_sv_special_token: false
  add_kiai_special_token: false
  add_song_position_token: false
  add_timing: true
  add_snapping: true
  add_timing_points: true
  add_hitsounds: false
  add_distances: false
  add_positions: false
  add_sv: false
  add_mania_sv: false
  add_kiai: false
  add_gd_context: false
  add_pre_tokens: false
  add_empty_sequences: true
  types_first: true
  rhythm_weight: 5.0            # default 3.0 — upweight timing tokens in loss
  label_smoothing: 0.05         # slight smoothing to help timing generalization
  dt_augment_prob: 0.0          # disable DT augment — SnapBeat has fixed BPM, this just adds noise
  dt_augment_range: [1.1, 1.4]
  timing_random_offset: 0
  context_types:
    - "in": ['${context_type:none}']
      "out": ['${context_type:map}']
  context_weights: [1]

optim:
  name: muon
  base_lr: 0.0002
  base_lr_2: 0.0001
  batch_size: 128
  grad_acc: 64
  total_steps: 2000
  warmup_steps: 200
  lr_scheduler: cosine
  final_cosine: 0

dataloader:
  num_workers: 4

eval:
  every_steps: 200
  steps: 50

checkpoint:
  every_steps: 500

lora:
  r: 64
  lora_alpha: 128
  target_modules: ['k_proj', 'v_proj', 'q_proj', 'out_proj', 'fc1', 'fc2']
  lora_dropout: 0.05
  bias: "none"
  init_lora_weights: "pissa"
