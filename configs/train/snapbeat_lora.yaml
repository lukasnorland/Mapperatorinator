defaults:
  - lora
  - _self_

compile: false                 # Runs 6–12 all used compile=false on this 12GB GPU; Triton/inductor fails to link CUDA libs (driver cu13 vs torch cu121)
pretrained_path: "OliBomby/Mapperatorinator-v31"
# Run 13 (rev2): Option-1 data-ceiling test. Resume Run 12's adapter (the rhythm-skeleton-mt3-v1 baseline)
# on the cleaned 2327-sample dataset (was 2337 — 10 corrupt charts removed 2026-05-12) and continue with
# Run 12's low-LR cosine tail. This is the cleanest comparison vs Run 12's 75.53%: same warm start, just
# more data per epoch. The original Run 13 (fresh-from-v31 cold start) was discarded because cold-start
# wasted ~600 steps relative to a warm resume; see SNAPBEAT_TRAINING_RESULTS.md for details.
lora_resume_path: "/home/norland/dev/Mapperatorinator/logs/2026-04-25/09-51-23/checkpoint-1001/lora"

# Avoid W&B unless configured; use tensorboard (see docs/SNAPBEAT_FINETUNING.md).
logging:
  log_with: tensorboard

data:
  dataset_type: "snapbeat"
  # JSON: ./datasets/dataset/json. Audio: ./datasets/dataset/audio (same UUID stems). Override with data.snapbeat_audio_path if audio lives elsewhere (e.g. ./dataset/audio).
  train_dataset_path: "./datasets/dataset"
  test_dataset_path: "./datasets/dataset"
  snapbeat_audio_path: ""
  train_dataset_start: 0
  train_dataset_end: 2093       # Run 13: 90% of cleaned 2327-sample dataset (10 charts removed 2026-05-12).
                                # Test set UUIDs are the exact same 234 charts the pre-cleanup runs evaluated on,
                                # so eval numbers remain directly comparable across the cleanup boundary.
  test_dataset_start: 2093      # was 2103 pre-cleanup
  test_dataset_end: 2327        # was 2337 pre-cleanup — full 2327 paired json+audio samples on disk
  gamemodes: [3]
  per_track: true
  # Disable osu!-specific features not relevant to SnapBeat
  add_gamemode_token: true
  add_style_token: false
  add_diff_token: false
  add_mapper_token: false
  add_year_token: false
  add_hitsounded_token: false
  add_song_length_token: false
  add_global_sv_token: false
  add_cs_token: false
  add_keycount_token: true
  add_hold_note_ratio_token: true
  add_scroll_speed_ratio_token: false
  add_descriptors: false
  add_sv_special_token: false
  add_kiai_special_token: false
  add_song_position_token: false
  add_timing: true
  add_snapping: true
  add_timing_points: true
  add_hitsounds: false
  add_distances: false
  add_positions: false
  add_sv: false
  add_mania_sv: false
  add_kiai: false
  add_gd_context: false
  add_pre_tokens: false
  add_empty_sequences: true
  types_first: true
  rhythm_weight: 5.0            # Run 11: keep at 5.0 (Runs 9/10 showed near-optimal)
  label_smoothing: 0.05         # Run 11: revert 0.1 → 0.05 — Run 10 (0.1/0.1) under-performed Run 8 (0.05/0.05) by 0.77pp
  dt_augment_prob: 0.0          # disable DT augment — SnapBeat has fixed BPM, this just adds noise
  dt_augment_range: [1.1, 1.4]
  timing_random_offset: 0              # jitter hurts exact timing (Run 7: -9pp) — keep off
  context_types:
    - "in": ['${context_type:timing}']
      "out": ['${context_type:map}']
  context_weights: [1]

optim:
  name: muon
  base_lr: 5.0e-05             # Run 13 (rev2): Run 12 tail LR (was 2e-4 for original fresh-start Run 13)
  base_lr_2: 2.5e-05           # Run 13 (rev2): Run 12 tail value (was 1e-4)
  batch_size: 64
  grad_acc: 64
  total_steps: 2000            # Run 13 (rev2): ~4.5 additional epochs over 2093 cleaned train samples on top of Run 12's converged adapter (Run 12 itself ran 1.66 epochs over its 602-sample tail)
  warmup_steps: 50             # Run 13 (rev2): short warmup since resuming a converged model (matches Run 12)
  lr_scheduler: cosine
  final_cosine: 0

dataloader:
  num_workers: 4

eval:
  every_steps: 200
  steps: 50

checkpoint:
  every_steps: 500

lora:
  r: 64                         # Run 12: revert to Run 8's r=64 (Run 11 r=128 tied within noise; resume requires matching shape)
  lora_alpha: 128               # Run 12: revert to Run 8's alpha=128 (alpha/r=2 unchanged)
  target_modules: ['k_proj', 'v_proj', 'q_proj', 'out_proj', 'fc1', 'fc2']
  lora_dropout: 0.05            # Run 8 value
  bias: "none"
  init_lora_weights: "pissa"    # Run 13 (rev2): PiSSA init shape; actual weights come from lora_resume_path (Run 12 adapter) at load time
